services:
  mongodb:
    image: mongo:8.0
    container_name: nosql_inventario_mongodb

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
